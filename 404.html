<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>maxaas.u — redirecting...</title>
<style>
  body{background:#020b14;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:monospace;color:#00b4ff;font-size:14px}
</style>
</head>
<body>
<span>redirecting...</span>
<script>
// ── 404 ROUTER ────────────────────────────────────────────────
// On static hosts (GitHub Pages, Netlify, IPFS, Cloudflare Pages),
// a URL like  maxaas.u/raage  or  maxaas.u/?u=raage  may hit a 404.
// This page catches it and redirects to index.html with the right param.

(function(){
  var username = '';

  // 1. Already has ?u= param — just forward to index
  try {
    var p = new URLSearchParams(window.location.search);
    username = (p.get('u') || '').trim().toLowerCase();
  } catch(e){}

  // 2. Path-based: /raage  →  /?u=raage
  if(!username){
    try {
      var seg = window.location.pathname.replace(/^\/+/, '').split('/')[0].trim().toLowerCase();
      if(seg && seg !== '' && seg !== 'index.html' && seg !== '404.html') username = seg;
    } catch(e){}
  }

  // 3. Hash fallback: #raage
  if(!username){
    try {
      var hash = window.location.hash.replace(/^#\/?/, '').trim().toLowerCase().split('?')[0].split('/')[0];
      if(hash && hash !== 'home') username = hash;
    } catch(e){}
  }

  if(username){
    window.location.replace('/?u=' + encodeURIComponent(username));
  } else {
    window.location.replace('/');
  }
})();
</script>
</body>
</html>
