<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxaas.u</title>
  <style>
    body {
      background: #080b10;
      color: #e8edf5;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #00e5ff; display: inline-block; margin: 0 4px; animation: b 1s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes b { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>
<div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<script>
  // GitHub Pages 404 trick: store the path and redirect to index.html
  // Supports clean URLs like maxaas.u/username → stores "/username" → index reads it
  var path = window.location.pathname;
  // Only store non-root paths that look like usernames
  if (path && path !== '/' && !path.includes('.')) {
    sessionStorage.setItem('biolink_redirect', path);
  }
  window.location.replace('/');
</script>
</body>
</html>
