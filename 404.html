<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>maxaas.u</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --accent:#7c6fff;--accent2:#00e5b0;--text:#f0f0f0;--muted:#888;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
a{text-decoration:none;color:inherit}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}

/* BG blobs */
.blob1{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,111,255,0.08) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none;z-index:0}
.blob2{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,176,0.06) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none;z-index:0}

/* LOADING */
#loading{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:100;
  background:var(--bg);
}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(124,111,255,0.2);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:var(--muted);font-size:14px}

/* NOT FOUND */
#notfound{
  position:fixed;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:100;
  background:var(--bg);text-align:center;padding:20px;
}
.nf-emoji{font-size:56px;margin-bottom:8px}
.nf-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800}
.nf-sub{color:var(--muted);font-size:15px;margin-bottom:24px}
.nf-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 24px rgba(124,111,255,.35);
}

/* BIO PAGE */
#bio{
  display:none;min-height:100vh;
  flex-direction:column;align-items:center;
  padding:60px 16px 100px;position:relative;z-index:1;
}

.bio-avatar{
  width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:40px;color:#fff;
  margin-bottom:18px;animation:fadeUp .5s both;
}
.bio-name{
  font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
  letter-spacing:-.5px;margin-bottom:10px;
  animation:fadeUp .5s .05s both;
}
.bio-bio{
  color:var(--muted);font-size:15px;max-width:340px;
  text-align:center;line-height:1.65;margin-bottom:12px;
  animation:fadeUp .5s .1s both;
}
.bio-domain{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(124,111,255,.12);border:1px solid rgba(124,111,255,.25);
  border-radius:20px;padding:5px 16px;margin-bottom:44px;
  color:#a09aff;font-family:monospace;font-size:13px;
  animation:fadeUp .5s .15s both;
}

.bio-links{width:100%;max-width:500px;display:flex;flex-direction:column;gap:14px}

.bio-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:19px 24px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;color:var(--text);
  transition:all .2s;
}
.bio-link:hover{
  background:rgba(124,111,255,.12);
  border-color:rgba(124,111,255,.35);
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(124,111,255,.15);
}
.bio-link:active{transform:translateY(0)}
.bio-link-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-right:14px;flex-shrink:0;
}
.bio-link-info{flex:1;min-width:0}
.bio-link-title{font-weight:600;font-size:16px}
.bio-link-url{color:#555;font-size:12px;font-family:monospace;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bio-arr{font-size:20px;opacity:.35;flex-shrink:0;margin-left:8px}

.bio-foot{
  color:#222;font-size:12px;margin-top:70px;
  display:flex;align-items:center;gap:6px;
}
.bio-foot a{color:var(--accent);font-weight:600}

.back-btn{
  position:fixed;top:16px;left:16px;z-index:10;
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:#aaa;padding:8px 16px;border-radius:10px;font-size:13px;
  transition:all .2s;
}
.back-btn:hover{background:rgba(255,255,255,.1);color:#fff}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Link animation stagger */
.bio-link{animation:fadeUp .4s both}
</style>
</head>
<body>

<div class="blob1"></div>
<div class="blob2"></div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div class="load-txt">Loading...</div>
</div>

<!-- NOT FOUND -->
<div id="notfound">
  <div class="nf-emoji">🔍</div>
  <div class="nf-title">Profile ma jirto</div>
  <div class="nf-sub" id="nf-sub">Ma jirto user-kan</div>
  <a href="https://assadhuuu.github.io/maxaas/" class="nf-btn">🏠 Bogga Hore</a>
</div>

<!-- BIO PAGE -->
<div id="bio">
  <a href="https://assadhuuu.github.io/maxaas/" class="back-btn">🏠 maxaas.u</a>
  <div class="bio-avatar" id="bio-avatar"></div>
  <div class="bio-name" id="bio-name"></div>
  <div class="bio-bio" id="bio-bio"></div>
  <div class="bio-domain">🌐 <span id="bio-domain-txt"></span></div>
  <div class="bio-links" id="bio-links"></div>
  <div class="bio-foot">Powered by <a href="https://assadhuuu.github.io/maxaas/">maxaas.u</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nbocbxruwjhwdqgufuiz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bIvH_u_ff-DEJPGQHWuqtg_jt4i5FAP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Get username from URL path ──────────────────────────────
// GitHub Pages: assadhuuu.github.io/maxaas/raage  → pathname = /maxaas/raage
// Unstoppable:  maxaas.u/raage                    → pathname = /raage
function getUsername(){
  var path = window.location.pathname;
  // Remove leading slash and repo prefix if on GitHub Pages
  path = path.replace(/^\/maxaas\//, '/').replace(/^\//, '');
  // Remove trailing slash
  path = path.replace(/\/$/, '');
  return path.toLowerCase() || null;
}

(async function(){
  var username = getUsername();

  if(!username){
    // No username → go to main page
    window.location.href = 'https://assadhuuu.github.io/maxaas/';
    return;
  }

  // Load profile
  var { data: profile, error: pErr } = await sb
    .from('profiles')
    .select('*')
    .eq('username', username)
    .single();

  if(pErr || !profile){
    document.getElementById('nf-sub').textContent = '@' + username + ' ma jirto';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notfound').style.display = 'flex';
    return;
  }

  // Load links
  var { data: links } = await sb
    .from('links')
    .select('*')
    .eq('user_id', profile.id)
    .order('position', { ascending: true });

  renderBio(profile, links || []);
})();

function renderBio(profile, links){
  var color = profile.color || '#7c6fff';

  // Avatar
  var av = document.getElementById('bio-avatar');
  av.textContent = (profile.display_name || profile.username)[0].toUpperCase();
  av.style.background = 'linear-gradient(135deg,' + color + ',#00e5b0)';
  av.style.boxShadow  = '0 0 60px ' + color + '55';

  // Text
  document.getElementById('bio-name').textContent = profile.display_name || profile.username;
  var bioEl = document.getElementById('bio-bio');
  if(profile.bio){
    bioEl.textContent = profile.bio;
    bioEl.style.display = 'block';
  } else {
    bioEl.style.display = 'none';
  }
  document.getElementById('bio-domain-txt').textContent = 'maxaas.u/' + profile.username;

  // Links
  var el = document.getElementById('bio-links');
  if(!links.length){
    el.innerHTML = '<p style="color:#333;text-align:center;padding:20px">Links ma jiraan weli.</p>';
  } else {
    el.innerHTML = links.map(function(l, i){
      var icon = getLinkIcon(l.url);
      return '<a class="bio-link" href="' + esc(l.url) + '" target="_blank" rel="noreferrer" style="animation-delay:' + (i * 0.08) + 's">'
        + '<div class="bio-link-icon" style="background:' + color + '22;border:1px solid ' + color + '44">' + icon + '</div>'
        + '<div class="bio-link-info">'
        + '<div class="bio-link-title">' + esc(l.title) + '</div>'
        + '<div class="bio-link-url">' + esc(l.url) + '</div>'
        + '</div>'
        + '<div class="bio-arr">→</div>'
        + '</a>';
    }).join('');
  }

  // Show page
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bio').style.display = 'flex';

  // Update page title
  document.title = (profile.display_name || profile.username) + ' — maxaas.u';
}

function getLinkIcon(url){
  url = url.toLowerCase();
  if(url.includes('youtube.com') || url.includes('youtu.be')) return '▶️';
  if(url.includes('tiktok.com'))   return '🎵';
  if(url.includes('instagram.com'))return '📸';
  if(url.includes('twitter.com') || url.includes('x.com')) return '𝕏';
  if(url.includes('facebook.com')) return '👥';
  if(url.includes('telegram.'))    return '✈️';
  if(url.includes('whatsapp.'))    return '💬';
  if(url.includes('github.com'))   return '💻';
  if(url.includes('spotify.'))     return '🎧';
  if(url.includes('linkedin.'))    return '💼';
  return '🔗';
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
