<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>maxaas.u</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020b14;
  --bg2:#041525;
  --surface:rgba(0,180,255,0.04);
  --surface2:rgba(0,180,255,0.08);
  --border:rgba(0,180,255,0.12);
  --border2:rgba(0,180,255,0.22);
  --accent:#00b4ff;
  --accent2:#00ffa3;
  --accent3:#0066ff;
  --text:#e8f4ff;
  --muted:#4a7a9b;
  --muted2:#2a5070;
  --danger:#ff4466;
  --glow1:rgba(0,180,255,0.15);
  --glow2:rgba(0,255,163,0.1);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif}
input,textarea,button{font-family:inherit}

/* GRID BACKGROUND */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,180,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,180,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,100,255,0.15) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

/* BLOBS */
.blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px)}

input,textarea{
  width:100%;
  background:rgba(0,20,40,0.6);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 16px;
  border-radius:10px;
  font-size:15px;
  transition:border .2s, box-shadow .2s;
  outline:none;
}
input:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,180,255,0.1), 0 0 20px rgba(0,180,255,0.08);
}
input::placeholder,textarea::placeholder{color:var(--muted2)}
button{cursor:pointer;border:none;transition:all .2s}
a{text-decoration:none;color:inherit}
#app{min-height:100vh}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

/* LOADING */
#loading{align-items:center;justify-content:center;flex-direction:column;gap:20px}
.spinner-ring{
  width:52px;height:52px;position:relative;
}
.spinner-ring::before,.spinner-ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;border:2px solid transparent;
}
.spinner-ring::before{
  border-top-color:var(--accent);
  border-right-color:var(--accent);
  animation:spin .9s linear infinite;
  filter:drop-shadow(0 0 8px var(--accent));
}
.spinner-ring::after{
  border-bottom-color:var(--accent2);
  border-left-color:var(--accent2);
  animation:spin .9s linear infinite reverse;
  inset:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:var(--muted);font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
.loading-txt::after{content:'...';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%,100%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* AUTH */
#auth{align-items:center;justify-content:center;padding:20px;flex-direction:column}
.auth-card{
  width:100%;max-width:420px;
  background:rgba(4,21,37,0.8);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 32px;
  position:relative;z-index:1;
  animation:fadeUp .5s ease both;
  backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(0,100,255,0.08), 0 0 0 1px rgba(0,180,255,0.06);
}
.auth-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(0,180,255,0.04) 0%,transparent 50%);
  pointer-events:none;
}
.logo-wrap{text-align:center;margin-bottom:32px}
.logo-icon{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:14px;
  box-shadow:0 0 0 1px rgba(0,180,255,0.3), 0 0 40px rgba(0,100,255,0.35), 0 0 80px rgba(0,180,255,0.15);
  animation:pulseglow 3s ease-in-out infinite;
}
@keyframes pulseglow{
  0%,100%{box-shadow:0 0 0 1px rgba(0,180,255,0.3),0 0 40px rgba(0,100,255,0.35),0 0 80px rgba(0,180,255,0.15)}
  50%{box-shadow:0 0 0 1px rgba(0,255,163,0.3),0 0 40px rgba(0,200,100,0.35),0 0 80px rgba(0,255,163,0.15)}
}
.logo-title{
  font-family:'Syne',sans-serif;font-size:32px;font-weight:800;
  background:linear-gradient(135deg,#fff 20%,var(--accent) 60%,var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.5px;
}
.logo-sub{color:var(--muted);font-size:13px;margin-top:4px;font-family:'JetBrains Mono',monospace}
.tab-toggle{
  display:flex;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--border);
  border-radius:10px;padding:4px;margin-bottom:26px;
}
.tab-btn{
  flex:1;padding:10px;border-radius:7px;
  background:transparent;color:var(--muted);font-weight:600;font-size:14px;
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(0,100,255,0.3),rgba(0,180,255,0.2));
  color:var(--accent);
  box-shadow:0 0 20px rgba(0,180,255,0.1);
}
.field-label{color:var(--muted);font-size:11px;font-weight:600;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace}
.field-wrap{margin-bottom:14px}
.btn-primary{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  color:#fff;font-weight:700;font-size:16px;
  box-shadow:0 4px 24px rgba(0,100,255,0.35), 0 0 0 1px rgba(0,180,255,0.2);
  margin-top:8px;letter-spacing:.02em;
  position:relative;overflow:hidden;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.08));
  pointer-events:none;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,100,255,0.45),0 0 0 1px rgba(0,180,255,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.err-msg{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:18px;font-family:'JetBrains Mono',monospace}
.hint{color:var(--muted2);font-size:12px;text-align:center;margin-top:14px;line-height:1.6;font-family:'JetBrains Mono',monospace}
.hint span{color:var(--accent2)}

/* DASHBOARD */
#dash{flex-direction:column}
.dash-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:rgba(2,11,20,0.92);
  backdrop-filter:blur(20px);
  z-index:10;
}
.dash-header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}
.user-pill{display:flex;align-items:center;gap:10px}
.avatar{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#fff;
}
.user-name{font-weight:700;font-size:15px}
.user-domain{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:1px}
.hdr-btns{display:flex;gap:8px}
.btn-sm{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;
  font-weight:600;font-size:13px;
}
.btn-preview{
  background:rgba(0,180,255,0.08);
  border:1px solid var(--border2);
  color:var(--accent);
}
.btn-preview:hover{background:rgba(0,180,255,0.15)}
.btn-logout{
  background:rgba(255,68,102,0.08);
  border:1px solid rgba(255,68,102,0.2);
  color:#ff6b7a;
}
.btn-logout:hover{background:rgba(255,68,102,0.15)}
.dash-body{padding:24px;max-width:600px;position:relative;z-index:1}

/* SHARE BANNER */
.share-banner{
  background:linear-gradient(135deg,rgba(0,100,255,0.1),rgba(0,255,163,0.06));
  border:1px solid rgba(0,180,255,0.2);
  border-radius:14px;padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.share-banner::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;
  background:radial-gradient(circle,rgba(0,255,163,0.12),transparent 70%);
  pointer-events:none;
}
.share-label{color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace}
.share-link{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--accent2);font-weight:600}
.btn-copy{
  display:flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:8px;
  background:rgba(0,255,163,0.1);
  border:1px solid rgba(0,255,163,0.25);
  color:var(--accent2);font-weight:600;font-size:13px;
}
.btn-copy:hover{background:rgba(0,255,163,0.2)}
.btn-copy.copied{background:rgba(0,180,255,0.15);border-color:rgba(0,180,255,0.35);color:var(--accent)}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:22px}
.tab{
  padding:9px 20px;border-radius:8px;
  background:transparent;color:var(--muted);font-weight:600;font-size:14px;
  border:1px solid transparent;
}
.tab.active{
  background:rgba(0,180,255,0.1);
  border-color:rgba(0,180,255,0.2);
  color:var(--accent);
}

/* CARDS */
.card{
  background:rgba(4,21,37,0.6);
  border:1px solid var(--border);
  border-radius:14px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(8px);
}
.card-title{color:var(--muted);font-size:11px;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace}
.btn-add{
  width:100%;padding:12px;border-radius:10px;margin-top:12px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,100,255,0.25);
}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,100,255,0.35)}
.btn-add:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.link-item{
  background:rgba(0,20,40,0.5);
  border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:border-color .2s;
}
.link-item:hover{border-color:var(--border2)}
.link-info{flex:1;min-width:0}
.link-title{font-weight:600;font-size:15px}
.link-url{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.btn-edit{background:rgba(0,180,255,0.1);border:1px solid rgba(0,180,255,0.25);color:var(--accent)}
.btn-del{background:rgba(255,68,102,0.08);border:1px solid rgba(255,68,102,0.2);color:#ff6b7a}
.empty-state{
  text-align:center;padding:40px 20px;color:var(--muted2);
  border:1px dashed var(--border);border-radius:14px;
  font-size:15px;line-height:2;
}
.color-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.color-preview{width:100px;height:40px;border-radius:8px;border:1px solid var(--border)}
.btn-save-profile{
  margin-top:20px;padding:12px 24px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 20px rgba(0,100,255,0.25);
}
.btn-save-profile:hover{transform:translateY(-1px)}
.btn-save-profile:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* BIO PAGE */
.bio-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:60px 16px 100px;width:100%;position:relative;z-index:1;
}
.bio-avatar{
  width:96px;height:96px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:42px;color:#fff;
  margin-bottom:20px;animation:fadeUp .5s both;
  position:relative;
}
.bio-avatar::after{
  content:'';position:absolute;inset:-2px;border-radius:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  z-index:-1;opacity:.4;
  animation:pulseglow 3s ease-in-out infinite;
}
.bio-name{
  font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
  letter-spacing:-.5px;margin-bottom:8px;animation:fadeUp .5s .05s both;
}
.bio-bio-txt{
  color:var(--muted);font-size:15px;max-width:360px;
  text-align:center;line-height:1.65;margin-bottom:12px;
  animation:fadeUp .5s .1s both;
}
.bio-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,180,255,0.08);
  border:1px solid rgba(0,180,255,0.2);
  border-radius:20px;padding:5px 16px;
  margin-bottom:44px;
  color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
  animation:fadeUp .5s .15s both;
}
.bio-links-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.bio-link-card{
  display:flex;align-items:center;padding:18px 22px;
  background:rgba(4,21,37,0.7);
  border:1px solid rgba(0,180,255,0.1);
  border-radius:16px;color:var(--text);
  transition:all .25s;animation:fadeUp .4s both;
  backdrop-filter:blur(8px);
}
.bio-link-card:hover{
  background:rgba(0,100,255,0.12);
  border-color:rgba(0,180,255,0.3);
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,100,255,0.15), 0 0 0 1px rgba(0,180,255,0.15);
}
.bio-link-icon{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-right:16px;flex-shrink:0;
}
.bio-link-info{flex:1;min-width:0}
.bio-link-title{font-weight:600;font-size:16px}
.bio-link-url{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bio-foot{color:var(--muted2);font-size:11px;margin-top:70px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.bio-foot span{color:var(--accent)}
.bio-back-btn{
  position:fixed;top:16px;left:16px;z-index:10;
  background:rgba(0,20,40,0.8);
  border:1px solid var(--border2);
  color:var(--accent);padding:8px 16px;
  border-radius:10px;font-size:13px;
  backdrop-filter:blur(8px);
}
.bio-back-btn:hover{background:rgba(0,180,255,0.1)}

/* NOT FOUND */
#notfound{align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px;}
.nf-emoji{font-size:60px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.nf-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nf-sub{color:var(--muted);font-size:15px;margin-bottom:24px}
.nf-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  color:#fff;font-weight:700;font-size:15px;cursor:pointer;border:none;
  box-shadow:0 4px 24px rgba(0,100,255,0.35);
}
.nf-btn:hover{transform:translateY(-1px)}

/* UTILS */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
#toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(4,21,37,0.95);
  border:1px solid rgba(0,180,255,0.3);
  color:var(--accent);
  padding:12px 24px;border-radius:30px;
  font-size:14px;font-weight:600;z-index:999;
  transition:transform .3s;pointer-events:none;
  backdrop-filter:blur(12px);
  box-shadow:0 0 30px rgba(0,100,255,0.2);
  font-family:'JetBrains Mono',monospace;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{border-color:rgba(255,68,102,0.4);color:#ff6b7a}

/* SCAN LINE EFFECT */
.scan-line{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.015) 2px,
    rgba(0,0,0,0.015) 4px
  );
}
</style>
</head>
<body>

<div class="blob" style="width:700px;height:700px;background:radial-gradient(circle,rgba(0,100,255,0.1) 0%,transparent 70%);top:-300px;right:-200px"></div>
<div class="blob" style="width:500px;height:500px;background:radial-gradient(circle,rgba(0,255,163,0.07) 0%,transparent 70%);bottom:-150px;left:-150px"></div>
<div class="blob" style="width:400px;height:400px;background:radial-gradient(circle,rgba(0,180,255,0.06) 0%,transparent 70%);top:50%;left:60%"></div>
<div class="scan-line"></div>

<div id="app">

  <div id="loading" class="screen active">
    <div class="spinner-ring"></div>
    <div class="loading-txt">maxaas.u</div>
  </div>

  <div id="notfound" class="screen">
    <div>
      <div class="nf-emoji">🔍</div>
      <div class="nf-title">Profile ma jirto</div>
      <div class="nf-sub" id="nf-msg">User-kan ma jirto</div>
      <button class="nf-btn" onclick="goHome()">🏠 Bogga Hore</button>
    </div>
  </div>

  <div id="auth" class="screen">
    <div class="auth-card">
      <div class="logo-wrap">
        <div class="logo-icon">🔗</div>
        <div class="logo-title">maxaas.u</div>
        <div class="logo-sub">// bio link-kaaga</div>
      </div>
      <div class="tab-toggle">
        <button class="tab-btn active" onclick="switchAuthTab('signin')">Gal</button>
        <button class="tab-btn" onclick="switchAuthTab('signup')">Diiwaan Geli</button>
      </div>
      <div id="signup-fields" class="hidden">
        <div class="field-wrap">
          <label class="field-label">Magacaaga</label>
          <input id="inp-name" type="text" placeholder="Magacaaga buuxda"/>
        </div>
        <div class="field-wrap">
          <label class="field-label">Username — maxaas.u/?u=username</label>
          <input id="inp-user-signup" type="text" placeholder="username" oninput="sanitizeUser(this)"/>
        </div>
      </div>
      <div class="field-wrap">
        <label class="field-label">Email</label>
        <input id="inp-email" type="email" placeholder="email@example.com"/>
      </div>
      <div class="field-wrap">
        <label class="field-label">Password</label>
        <input id="inp-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()"/>
      </div>
      <div id="auth-err" class="err-msg"></div>
      <button class="btn-primary" onclick="doAuth()" id="auth-btn">Gal →</button>
      <div id="signup-hint" class="hint hidden">
        Link-kaaga: <span>maxaas.u/?u=username-kaaga</span>
      </div>
    </div>
  </div>

  <div id="dash" class="screen">
    <div class="dash-header">
      <div class="user-pill">
        <div class="avatar" id="hdr-avatar"></div>
        <div>
          <div class="user-name" id="hdr-name"></div>
          <div class="user-domain" id="hdr-domain"></div>
        </div>
      </div>
      <div class="hdr-btns">
        <button class="btn-sm btn-preview" onclick="openPreview()">👁 Preview</button>
        <button class="btn-sm btn-logout" onclick="doLogout()">↩ Ka bax</button>
      </div>
    </div>

          <div class="share-label">Link-kaaga la wadaajin karo</div>

      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('links',this)">🔗 Links</button>
        <button class="tab" onclick="switchTab('profile',this)">👤 Profile</button>
      </div>
      <div id="tab-links">
        <div class="card">
          <div class="card-title">Link cusub ku dar</div>
          <input id="new-title" type="text" placeholder="Cinwaanka (e.g. YouTube Channel)" style="margin-bottom:10px"/>
          <input id="new-url" type="text" placeholder="URL (e.g. youtube.com/...)" onkeydown="if(event.key==='Enter')addLink()"/>
          <div id="link-err" class="err-msg" style="margin-top:8px"></div>
          <button class="btn-add" onclick="addLink()" id="add-btn">＋ Kudar</button>
        </div>
        <div id="link-list"></div>

      <div id="tab-profile" class="hidden">
        <div class="card">
          <div class="card-title">Profile-kaaga tafaasiilaadii</div>

          <div class="field-wrap">
            <label class="field-label">Bio</label>
            <textarea id="prof-bio" rows="3" placeholder="Nafta kooban u sharax..." style="resize:vertical"></textarea>
          </div>
          <div class="field-wrap">
            <label class="field-label">Midabkaaga</label>
            <div class="color-row">
              <input type="color" id="prof-color" style="width:48px;height:42px;border-radius:8px;border:none;background:none;cursor:pointer" oninput="updateColorPreview()"/>
              <div class="color-preview" id="color-preview"></div>

  <!-- PREVIEW inside dashboard -->
  <div id="bio" class="screen">
    <button class="bio-back-btn" onclick="show('dash')">← Dib</button>
    <div class="bio-wrap" id="bio-wrap"></div>
  </div>

  <!-- PUBLIC BIO PAGE -->

    <div class="bio-wrap" id="pub-wrap"></div>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nbocbxruwjhwdqgufuiz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bIvH_u_ff-DEJPGQHWuqtg_jt4i5FAP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var ME = null, PROFILE = null, AUTH_MODE = 'signin';

// ── ROUTER ─────────────────────────────────────────────────────
// Checks ALL possible places a username might appear:
//   1. ?u=username  (primary — IPFS/Web3 gateway compatible)
//   2. #username    (legacy hash fallback)
//   3. /username    (pathname fallback, e.g. IPFS path rewrite)
// Returns lowercase trimmed string or null.
function getRouteUsername(){
  var u = '';

  // 1. URL search param  ?u=...
  try {
    var params = new URLSearchParams(window.location.search);
    u = (params.get('u') || '').trim().toLowerCase();
    if(u && u !== 'home') return u;
  } catch(e){}

  // 2. Hash fallback  #username  (legacy / some gateways)
  try {
    var hash = window.location.hash.replace(/^#\/?/, '').trim().toLowerCase().split('?')[0].split('/')[0];
    if(hash && hash !== 'home') return hash;
  } catch(e){}

  // 3. Pathname fallback  /username  (IPFS path rewrite / reverse proxy)
  try {
    var path = window.location.pathname.replace(/^\/+/, '').split('/')[0].trim().toLowerCase();
    if(path && path !== '' && path !== 'index.html' && path !== 'home') return path;
  } catch(e){}

  return null;
}

// Init fires after DOM + all scripts are ready
async function init(){
  show('loading');

  // Read username synchronously BEFORE any async call
  var username = getRouteUsername();

  if(username){
    await loadPublicBio(username);
    return;
  }

  // No username in URL — check for logged-in session
  try {
    var result = await sb.auth.getSession();
    var session = result && result.data && result.data.session;
    if(session){ ME = session.user; await loadProfile(); show('dash'); }
    else { show('auth'); }
  } catch(e){
    console.error('Session error:', e);
    show('auth');
  }
}

// Run after everything is parsed and loaded
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Listen for popstate (back/forward navigation with URL params)
window.addEventListener('popstate', async function(){
  var username = getRouteUsername();
  if(username){ show('loading'); await loadPublicBio(username); }
  else { if(ME){ show('dash'); } else { show('auth'); } }
});

// ── PUBLIC BIO ─────────────────────────────────────────────────
async function loadPublicBio(username){
  var { data: profile, error } = await sb.from('profiles').select('*').eq('username', username).single();
  if(error || !profile){
    document.getElementById('nf-msg').textContent = '"'+username+'" profile ma jirto';
    show('notfound'); return;
  }
  var { data: links } = await sb.from('links').select('*').eq('user_id', profile.id).order('position',{ascending:true});
  document.getElementById('pub-wrap').innerHTML = buildBioHTML(profile, links||[]);
  show('public-bio');
  document.title = (profile.display_name||profile.username) + ' — maxaas.u';
}

function buildBioHTML(profile, links){
  var color = profile.color || '#0066ff';
  var html = '<div class="bio-avatar" style="background:linear-gradient(135deg,'+color+',#00ffa3)">'
    +(profile.display_name||profile.username)[0].toUpperCase()
    +'</div>'
    +'<div class="bio-name">'+esc(profile.display_name||profile.username)+'</div>';
  if(profile.bio) html += '<div class="bio-bio-txt">'+esc(profile.bio)+'</div>';
  html += '<div class="bio-badge">🌐 maxaas.u/?u='+esc(profile.username)+'</div>'
    +'<div class="bio-links-wrap">';
  if(!links.length){
    html += '<p style="color:var(--muted2);text-align:center;padding:20px;font-family:\'JetBrains Mono\',monospace;font-size:13px">// Links ma jiraan weli.</p>';
  } else {
    html += links.map(function(l,i){
      var icon = getLinkIcon(l.url);
      return '<a class="bio-link-card" href="'+esc(l.url)+'" target="_blank" rel="noreferrer" style="animation-delay:'+(i*0.08)+'s">'
        +'<div class="bio-link-icon" style="background:'+color+'18;border:1px solid '+color+'33">'+icon+'</div>'
        +'<div class="bio-link-info"><div class="bio-link-title">'+esc(l.title)+'</div><div class="bio-link-url">'+esc(l.url)+'</div></div>'
        +'<span style="font-size:18px;opacity:.3;flex-shrink:0;margin-left:auto;padding-left:12px;color:var(--accent)">→</span>'
        +'</a>';
    }).join('');
  }
  html += '</div><div class="bio-foot">Powered by <span>maxaas.u</span></div>';
  return html;
}

function goHome(){
  window.location.href = window.location.origin + '/';
}

// ── SCREEN ─────────────────────────────────────────────────────
function show(id){
  document.querySelectorAll('.screen').forEach(s=>{ s.classList.remove('active'); s.style.display='none'; });
  var el = document.getElementById(id);
  el.classList.add('active'); el.style.display='flex';
}

// ── AUTH ───────────────────────────────────────────────────────
function switchAuthTab(mode){
  AUTH_MODE = mode;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&mode==='signin')||(i===1&&mode==='signup')));
  document.getElementById('signup-fields').classList.toggle('hidden', mode==='signin');
  document.getElementById('signup-hint').classList.toggle('hidden', mode==='signin');
  document.getElementById('auth-btn').textContent = mode==='signin' ? 'Gal →' : 'Account Samee →';
  document.getElementById('auth-err').textContent = '';
}

function sanitizeUser(el){ el.value = el.value.toLowerCase().replace(/[^a-z0-9_]/g,''); }

async function doAuth(){
  var email=document.getElementById('inp-email').value.trim();
  var pass=document.getElementById('inp-pass').value;
  var err=document.getElementById('auth-err');
  var btn=document.getElementById('auth-btn');
  err.textContent='';
  if(!email||!pass){ err.textContent='Email iyo password buuxi'; return; }
  btn.disabled=true; btn.textContent='...';

  if(AUTH_MODE==='signup'){
    var username=document.getElementById('inp-user-signup').value.trim().toLowerCase();
    var name=document.getElementById('inp-name').value.trim()||username;
    if(!username||username.length<3){ err.textContent='Username waa inuu ka badnaan yahay 2 xarfo'; btn.disabled=false; btn.textContent='Account Samee →'; return; }
    var {data:ex}=await sb.from('profiles').select('id').eq('username',username).single();
    if(ex){ err.textContent='Username-kan la isticmaalaa. Kale dooro.'; btn.disabled=false; btn.textContent='Account Samee →'; return; }
    var {data,error}=await sb.auth.signUp({email,password:pass});
    if(error){ err.textContent=error.message; btn.disabled=false; btn.textContent='Account Samee →'; return; }
    ME=data.user;
    var {error:pErr}=await sb.from('profiles').insert({id:ME.id,username,display_name:name,bio:'',color:'#0066ff'});
    if(pErr){ err.textContent=pErr.message; btn.disabled=false; btn.textContent='Account Samee →'; return; }
    await loadProfile(); show('dash'); toast('✓ Account la sameeyay! Soo dhawoow!');
  } else {
    var {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){ err.textContent='Email ama password khalad ah'; btn.disabled=false; btn.textContent='Gal →'; return; }
    ME=data.user; await loadProfile(); show('dash'); toast('✓ Soo gashay!');
  }
  btn.disabled=false;
}

async function doLogout(){
  await sb.auth.signOut(); ME=null; PROFILE=null;
  document.getElementById('inp-pass').value='';
  document.getElementById('auth-err').textContent='';
  show('auth');
}

// ── PROFILE ────────────────────────────────────────────────────
async function loadProfile(){
  var {data,error}=await sb.from('profiles').select('*').eq('id',ME.id).single();
  if(error||!data){ toast('Profile loading khalad',true); return; }
  PROFILE=data; refreshDash();
}

function refreshDash(){
  var color=PROFILE.color||'#0066ff';
  var av=document.getElementById('hdr-avatar');
  av.textContent=(PROFILE.display_name||PROFILE.username)[0].toUpperCase();
  av.style.background='linear-gradient(135deg,'+color+',#00ffa3)';
  av.style.boxShadow='0 0 20px '+color+'66';
  document.getElementById('hdr-name').textContent=PROFILE.display_name||PROFILE.username;
  // Updated: show new URL format in header
  document.getElementById('hdr-domain').textContent='maxaas.u/?u='+PROFILE.username;
  // Updated: show new URL format in share banner
  document.getElementById('share-link-text').textContent='maxaas.u/?u='+PROFILE.username;
  document.getElementById('prof-name').value=PROFILE.display_name||PROFILE.username;
  document.getElementById('prof-bio').value=PROFILE.bio||'';
  document.getElementById('prof-color').value=color;
  document.getElementById('color-preview').style.background='linear-gradient(135deg,'+color+',#00ffa3)';
  document.getElementById('color-hex').textContent=color;
  loadLinks();
}

async function saveProfile(){
  var btn=document.getElementById('save-profile-btn');
  btn.disabled=true; btn.textContent='...';
  var display_name=document.getElementById('prof-name').value.trim()||PROFILE.username;
  var bio=document.getElementById('prof-bio').value.trim();
  var color=document.getElementById('prof-color').value;
  var {error}=await sb.from('profiles').update({display_name,bio,color}).eq('id',ME.id);
  if(error){ toast('Khalad: '+error.message,true); }
  else{ PROFILE.display_name=display_name; PROFILE.bio=bio; PROFILE.color=color; refreshDash(); toast('✓ Profile la keydiiyay!'); }
  btn.disabled=false; btn.textContent='✓ Keydi Profile';
}

function updateColorPreview(){
  var c=document.getElementById('prof-color').value;
  document.getElementById('color-preview').style.background='linear-gradient(135deg,'+c+',#00ffa3)';
  document.getElementById('color-hex').textContent=c;
}

// ── LINKS ──────────────────────────────────────────────────────
async function loadLinks(){
  var {data,error}=await sb.from('links').select('*').eq('user_id',ME.id).order('position',{ascending:true});
  if(error){ toast('Links loading khalad',true); return; }
  renderLinks(data||[]);
}

function renderLinks(links){
  var list=document.getElementById('link-list');
  if(!links.length){ list.innerHTML='<div class="empty-state">🔗<br/>Links ma jiraan weli.<br/>Mid ku dar!</div>'; return; }
  list.innerHTML=links.map(function(l){
    return '<div class="link-item" id="li-'+l.id+'">'
      +'<div class="link-info"><div class="link-title">'+esc(l.title)+'</div><div class="link-url">'+esc(l.url)+'</div></div>'
      +'<div class="link-actions">'
      +'<button class="icon-btn btn-edit" onclick="startEdit(\''+l.id+'\',\''+esc(l.title)+'\',\''+esc(l.url)+'\')">✏️</button>'
      +'<button class="icon-btn btn-del" onclick="delLink(\''+l.id+'\')">🗑</button>'
      +'</div></div>';
  }).join('');
}

async function addLink(){
  var t=document.getElementById('new-title').value.trim();
  var u=document.getElementById('new-url').value.trim();
  var err=document.getElementById('link-err');
  var btn=document.getElementById('add-btn');
  if(!t||!u){ err.textContent='Cinwaanka iyo URL-ka buuxi'; return; }
  if(!u.startsWith('http')) u='https://'+u;
  err.textContent=''; btn.disabled=true;
  var {data:ex}=await sb.from('links').select('position').eq('user_id',ME.id).order('position',{ascending:false}).limit(1);
  var pos=ex&&ex.length?ex[0].position+1:0;
  var {error}=await sb.from('links').insert({user_id:ME.id,title:t,url:u,position:pos});
  if(error){ err.textContent=error.message; btn.disabled=false; return; }
  document.getElementById('new-title').value=''; document.getElementById('new-url').value='';
  btn.disabled=false; toast('✓ Link la daray!'); loadLinks();
}

async function delLink(id){
  var {error}=await sb.from('links').delete().eq('id',id).eq('user_id',ME.id);
  if(error){ toast('Khalad: '+error.message,true); return; }
  toast('🗑 La tirtiraye'); loadLinks();
}

function startEdit(id,title,url){
  var el=document.getElementById('li-'+id);
  el.innerHTML='<div style="width:100%">'
    +'<input id="et-'+id+'" value="'+title+'" style="margin-bottom:8px"/>'
    +'<input id="eu-'+id+'" value="'+url+'"/>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<button onclick="saveEdit(\''+id+'\')" style="padding:9px 18px;border-radius:8px;background:linear-gradient(135deg,#0066ff,#00b4ff);color:#fff;font-weight:700">Keydi</button>'
    +'<button onclick="loadLinks()" style="padding:9px 18px;border-radius:8px;background:rgba(0,180,255,0.06);border:1px solid rgba(0,180,255,0.15);color:var(--muted)">Jooji</button>'
    +'</div></div>';
}

async function saveEdit(id){
  var t=document.getElementById('et-'+id).value.trim();
  var u=document.getElementById('eu-'+id).value.trim();
  if(!t||!u) return;
  if(!u.startsWith('http')) u='https://'+u;
  var {error}=await sb.from('links').update({title:t,url:u}).eq('id',id).eq('user_id',ME.id);
  if(error){ toast('Khalad: '+error.message,true); return; }
  toast('✓ Link la cusbooneysiiyay!'); loadLinks();
}

function switchTab(name,btn){
  document.getElementById('tab-links').classList.toggle('hidden',name!=='links');
  document.getElementById('tab-profile').classList.toggle('hidden',name!=='profile');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

function copyLink(){
  // Updated: copy new URL param format
  var txt='maxaas.u/?u='+PROFILE.username;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  var btn=document.getElementById('copy-btn');
  btn.textContent='✓ La koobiyeeyay!'; btn.classList.add('copied');
  toast('✓ La koobiyeeyay!');
  setTimeout(()=>{ btn.textContent='📋 Koobiyee'; btn.classList.remove('copied'); },2000);
}

async function openPreview(){
  var {data:links}=await sb.from('links').select('*').eq('user_id',ME.id).order('position',{ascending:true});
  document.getElementById('bio-wrap').innerHTML = buildBioHTML(PROFILE, links||[]);
  show('bio');
}

function getLinkIcon(url){
  url=(url||'').toLowerCase();
  if(url.includes('youtube.com')||url.includes('youtu.be')) return '▶️';
  if(url.includes('tiktok.')) return '🎵';
  if(url.includes('instagram.')) return '📸';
  if(url.includes('twitter.')||url.includes('x.com')) return '𝕏';
  if(url.includes('facebook.')) return '👥';
  if(url.includes('telegram.')) return '✈️';
  if(url.includes('whatsapp.')) return '💬';
  if(url.includes('github.')) return '💻';
  if(url.includes('spotify.')) return '🎧';
  if(url.includes('linkedin.')) return '💼';
  return '🔗';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg,isErr){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('error',!!isErr);
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
