<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>maxaas.u — Bio Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --accent:#7c6fff;--accent2:#00e5b0;--text:#f0f0f0;--muted:#888;--danger:#ff5566;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
input,textarea,button{font-family:inherit}
input,textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:12px 16px;border-radius:10px;font-size:15px;
  transition:border .2s;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:#555}
button{cursor:pointer;border:none;transition:all .2s}
a{text-decoration:none;color:inherit}

#app{min-height:100vh}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}

/* ── LOADING ── */
#loading{align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(124,111,255,0.2);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:var(--muted);font-size:14px}

/* ── AUTH ── */
#auth{align-items:center;justify-content:center;padding:20px;flex-direction:column}
.auth-card{
  width:100%;max-width:420px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:20px;
  padding:40px 32px;position:relative;z-index:1;
  animation:fadeUp .5s ease both;
}
.logo-wrap{text-align:center;margin-bottom:32px}
.logo-icon{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:14px;
  box-shadow:0 0 40px rgba(124,111,255,0.4);
}
.logo-title{
  font-family:'Syne',sans-serif;font-size:30px;font-weight:800;
  background:linear-gradient(135deg,#fff 30%,#a09aff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-sub{color:var(--muted);font-size:14px;margin-top:4px}
.tab-toggle{
  display:flex;background:rgba(255,255,255,0.04);
  border-radius:10px;padding:4px;margin-bottom:26px;
}
.tab-btn{
  flex:1;padding:10px;border-radius:8px;background:transparent;
  color:#666;font-weight:600;font-size:14px;
}
.tab-btn.active{background:rgba(124,111,255,0.25);color:#a09aff}
.field-label{color:var(--muted);font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.field-wrap{margin-bottom:14px}
.btn-primary{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:16px;
  box-shadow:0 4px 24px rgba(124,111,255,0.35);
  margin-top:8px;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(124,111,255,0.45)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.err-msg{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:18px}
.hint{color:#444;font-size:12px;text-align:center;margin-top:14px;line-height:1.6}
.hint span{color:var(--accent)}

/* ── DASHBOARD ── */
#dash{flex-direction:column}
.dash-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(8,8,15,0.9);
  backdrop-filter:blur(12px);z-index:10;
}
.user-pill{display:flex;align-items:center;gap:10px}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#fff;
}
.user-name{font-weight:700;font-size:15px}
.user-domain{color:#555;font-size:12px;font-family:monospace}
.hdr-btns{display:flex;gap:8px}
.btn-sm{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;
}
.btn-preview{background:var(--surface);border:1px solid var(--border);color:#aaa}
.btn-logout{background:rgba(255,85,102,.1);border:1px solid rgba(255,85,102,.2);color:#ff6b7a}
.dash-body{padding:20px 24px;max-width:580px;position:relative;z-index:1}

.share-banner{
  background:linear-gradient(135deg,rgba(124,111,255,.12),rgba(0,229,176,.08));
  border:1px solid rgba(124,111,255,.3);
  border-radius:14px;padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;margin-bottom:24px;
}
.share-label{color:var(--muted);font-size:12px;margin-bottom:4px}
.share-link{font-family:monospace;font-size:16px;color:#a09aff;font-weight:600}
.btn-copy{
  display:flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:8px;
  background:rgba(124,111,255,.25);border:1px solid rgba(124,111,255,.4);
  color:#a09aff;font-weight:600;font-size:14px;
}
.btn-copy.copied{background:rgba(0,229,176,.2);border-color:rgba(0,229,176,.4);color:#00e5b0}

.tabs{display:flex;gap:4px;margin-bottom:22px}
.tab{padding:9px 20px;border-radius:8px;background:transparent;color:#555;font-weight:600;font-size:14px}
.tab.active{background:rgba(124,111,255,.2);color:#a09aff}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:20px;margin-bottom:16px;
}
.card-title{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px}
.btn-add{
  width:100%;padding:12px;border-radius:10px;margin-top:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-add:disabled{opacity:0.6;cursor:not-allowed}

.link-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.link-info{flex:1;min-width:0}
.link-title{font-weight:600;font-size:15px}
.link-url{color:#555;font-size:12px;font-family:monospace;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.btn-edit{background:rgba(124,111,255,.15);border:1px solid rgba(124,111,255,.3);color:#a09aff}
.btn-del{background:rgba(255,85,102,.1);border:1px solid rgba(255,85,102,.25);color:#ff6b7a}
.empty-state{
  text-align:center;padding:40px 20px;
  color:#444;border:1px dashed var(--border);border-radius:14px;
  font-size:15px;line-height:2;
}

.color-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.color-preview{width:100px;height:40px;border-radius:8px}
.btn-save-profile{
  margin-top:20px;padding:12px 24px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:15px;
}
.btn-save-profile:disabled{opacity:0.6;cursor:not-allowed}

/* ── BIO PAGE ── */
#bio{align-items:center;justify-content:flex-start;flex-direction:column;padding:48px 16px 80px}
.bio-back{
  position:fixed;top:16px;left:16px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:#aaa;padding:8px 16px;border-radius:8px;font-size:13px;z-index:10;
}
.bio-avatar{
  width:90px;height:90px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:38px;color:#fff;
  margin-bottom:16px;position:relative;z-index:1;
}
.bio-name{
  font-family:'Syne',sans-serif;font-size:26px;font-weight:800;
  margin-bottom:8px;letter-spacing:-.5px;
}
.bio-bio{color:var(--muted);font-size:15px;max-width:320px;text-align:center;line-height:1.6;margin-bottom:10px}
.bio-domain{
  display:flex;align-items:center;gap:6px;
  background:rgba(124,111,255,.12);border:1px solid rgba(124,111,255,.25);
  border-radius:20px;padding:4px 14px;margin-bottom:40px;
  color:#a09aff;font-family:monospace;font-size:13px;
}
.bio-links{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.bio-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;color:var(--text);
  transition:all .2s;animation:fadeUp .4s both;
}
.bio-link:hover{
  background:rgba(124,111,255,.12);border-color:rgba(124,111,255,.35);
  transform:translateY(-2px);
}
.bio-link-title{font-weight:600;font-size:16px}
.bio-foot{color:#2a2a3a;font-size:12px;margin-top:60px}
.bio-foot span{color:var(--accent)}

/* ── UTILS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
#toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1a1a2e;border:1px solid rgba(124,111,255,.4);
  color:#a09aff;padding:12px 24px;border-radius:30px;
  font-size:14px;font-weight:600;z-index:999;transition:transform .3s;
  pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{border-color:rgba(255,85,102,.4);color:#ff6b7a}
</style>
</head>
<body>

<div id="app">

  <!-- LOADING -->
  <div id="loading" class="screen active">
    <div class="spinner"></div>
    <div class="loading-txt">Loading...</div>
  </div>

  <!-- AUTH -->
  <div id="auth" class="screen">
    <div class="auth-card">
      <div class="logo-wrap">
        <div class="logo-icon">🔗</div>
        <div class="logo-title">maxaas.u</div>
        <div class="logo-sub">Bio link-kaaga</div>
      </div>

      <div class="tab-toggle">
        <button class="tab-btn active" onclick="switchAuthTab('signin')">Gal</button>
        <button class="tab-btn" onclick="switchAuthTab('signup')">Diiwaan Geli</button>
      </div>

      <div id="signup-fields" class="hidden">
        <div class="field-wrap">
          <label class="field-label">Magacaaga</label>
          <input id="inp-name" type="text" placeholder="Magacaaga buuxda"/>
        </div>
        <div class="field-wrap">
          <label class="field-label">Username (maxaas.u/username)</label>
          <input id="inp-user-signup" type="text" placeholder="username" oninput="sanitizeUser(this)"/>
        </div>
      </div>

      <div class="field-wrap">
        <label class="field-label">Email</label>
        <input id="inp-email" type="email" placeholder="email@example.com"/>
      </div>
      <div class="field-wrap">
        <label class="field-label">Password</label>
        <input id="inp-pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doAuth()"/>
      </div>

      <div id="auth-err" class="err-msg"></div>

      <button class="btn-primary" onclick="doAuth()" id="auth-btn">Gal →</button>

      <div id="signup-hint" class="hint hidden">
        Account samaysatid waxa kaaga soo baxaa<br/>
        link gaar ah: <span>maxaas.u/username-kaaga</span>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="screen">
    <div class="dash-header">
      <div class="user-pill">
        <div class="avatar" id="hdr-avatar"></div>
        <div>
          <div class="user-name" id="hdr-name"></div>
          <div class="user-domain" id="hdr-domain"></div>
        </div>
      </div>
      <div class="hdr-btns">
        <button class="btn-sm btn-preview" onclick="openPreview()">👁 Preview</button>
        <button class="btn-sm btn-logout" onclick="doLogout()">↩ Ka bax</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="share-banner">
        <div>
          <div class="share-label">Link-kaaga la wadaajin karo</div>
          <div class="share-link" id="share-link-text"></div>
        </div>
        <button class="btn-copy" id="copy-btn" onclick="copyLink()">📋 Koobiyee</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('links',this)">🔗 Links</button>
        <button class="tab" onclick="switchTab('profile',this)">👤 Profile</button>
      </div>

      <!-- LINKS TAB -->
      <div id="tab-links">
        <div class="card">
          <div class="card-title">Link cusub ku dar</div>
          <input id="new-title" type="text" placeholder="Cinwaanka (e.g. YouTube Channel)" style="margin-bottom:10px"/>
          <input id="new-url" type="text" placeholder="URL (e.g. youtube.com/...)" onkeydown="if(event.key==='Enter')addLink()"/>
          <div id="link-err" class="err-msg" style="margin-top:8px"></div>
          <button class="btn-add" onclick="addLink()" id="add-btn">＋ Kudar</button>
        </div>
        <div id="link-list"></div>
      </div>

      <!-- PROFILE TAB -->
      <div id="tab-profile" class="hidden">
        <div class="card">
          <div class="card-title">Profile-kaaga tafaasiilaadii</div>
          <div class="field-wrap">
            <label class="field-label">Magacaaga la muujinayo</label>
            <input id="prof-name" type="text"/>
          </div>
          <div class="field-wrap">
            <label class="field-label">Bio</label>
            <textarea id="prof-bio" rows="3" placeholder="Nafta kooban u sharax..." style="resize:vertical"></textarea>
          </div>
          <div class="field-wrap">
            <label class="field-label">Midabkaaga</label>
            <div class="color-row">
              <input type="color" id="prof-color" style="width:48px;height:42px;border-radius:8px;border:none;background:none;cursor:pointer" oninput="updateColorPreview()"/>
              <div class="color-preview" id="color-preview"></div>
              <span id="color-hex" style="color:#555;font-family:monospace;font-size:12px"></span>
            </div>
          </div>
          <button class="btn-save-profile" onclick="saveProfile()" id="save-profile-btn">✓ Keydi Profile</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BIO PAGE -->
  <div id="bio" class="screen">
    <button class="bio-back" onclick="closeBio()">← Dib</button>
    <div class="bio-avatar" id="bio-avatar"></div>
    <div class="bio-name" id="bio-name"></div>
    <div class="bio-bio" id="bio-bio"></div>
    <div class="bio-domain">🌐 <span id="bio-domain-txt"></span></div>
    <div class="bio-links" id="bio-links"></div>
    <div class="bio-foot">Powered by <span>maxaas.u</span></div>
  </div>

</div>

<div id="toast"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://nbocbxruwjhwdqgufuiz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bIvH_u_ff-DEJPGQHWuqtg_jt4i5FAP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── STATE ────────────────────────────────────────────────────
var ME = null;        // current auth user
var PROFILE = null;   // current profile row
var AUTH_MODE = 'signin';

// ── INIT ─────────────────────────────────────────────────────
(async function init(){
  show('loading');
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    ME = session.user;
    await loadProfile();
    show('dash');
  } else {
    show('auth');
  }

  // Listen for auth changes
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === 'SIGNED_IN' && session){
      ME = session.user;
    } else if(event === 'SIGNED_OUT'){
      ME = null; PROFILE = null;
    }
  });
})();

// ── SCREEN ───────────────────────────────────────────────────
function show(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
    s.style.display='none';
  });
  var el = document.getElementById(id);
  el.classList.add('active');
  el.style.display='flex';
}

// ── AUTH ─────────────────────────────────────────────────────
function switchAuthTab(mode){
  AUTH_MODE = mode;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&mode==='signin')||(i===1&&mode==='signup'));
  });
  document.getElementById('signup-fields').classList.toggle('hidden', mode==='signin');
  document.getElementById('signup-hint').classList.toggle('hidden', mode==='signin');
  document.getElementById('auth-btn').textContent = mode==='signin' ? 'Gal →' : 'Account Samee →';
  document.getElementById('auth-err').textContent = '';
}

function sanitizeUser(el){
  el.value = el.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
}

async function doAuth(){
  var email = document.getElementById('inp-email').value.trim();
  var pass  = document.getElementById('inp-pass').value;
  var err   = document.getElementById('auth-err');
  var btn   = document.getElementById('auth-btn');
  err.textContent = '';

  if(!email || !pass){ err.textContent = 'Email iyo password buuxi'; return; }

  btn.disabled = true;
  btn.textContent = '...';

  if(AUTH_MODE === 'signup'){
    var username = document.getElementById('inp-user-signup').value.trim().toLowerCase();
    var name = document.getElementById('inp-name').value.trim() || username;
    if(!username || username.length < 3){
      err.textContent = 'Username waa inuu ka badnaan yahay 2 xarfo';
      btn.disabled = false; btn.textContent = 'Account Samee →'; return;
    }

    // Check username taken
    var { data: existing } = await sb.from('profiles').select('id').eq('username', username).single();
    if(existing){
      err.textContent = 'Username-kan la isticmaalaa. Kale dooro.';
      btn.disabled = false; btn.textContent = 'Account Samee →'; return;
    }

    var { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error){ err.textContent = error.message; btn.disabled=false; btn.textContent='Account Samee →'; return; }

    ME = data.user;
    // Create profile
    var { error: pErr } = await sb.from('profiles').insert({
      id: ME.id,
      username: username,
      display_name: name,
      bio: '',
      color: '#7c6fff'
    });
    if(pErr){ err.textContent = pErr.message; btn.disabled=false; btn.textContent='Account Samee →'; return; }

    await loadProfile();
    show('dash');
    toast('✓ Account la sameeyay! Soo dhawoow!');

  } else {
    var { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ err.textContent = 'Email ama password khalad ah'; btn.disabled=false; btn.textContent='Gal →'; return; }
    ME = data.user;
    await loadProfile();
    show('dash');
    toast('✓ Soo gashay!');
  }

  btn.disabled = false;
}

async function doLogout(){
  await sb.auth.signOut();
  ME = null; PROFILE = null;
  document.getElementById('inp-pass').value = '';
  document.getElementById('auth-err').textContent = '';
  show('auth');
}

// ── PROFILE ──────────────────────────────────────────────────
async function loadProfile(){
  var { data, error } = await sb.from('profiles').select('*').eq('id', ME.id).single();
  if(error || !data){ toast('Profile loading khalad', true); return; }
  PROFILE = data;
  refreshDash();
}

function refreshDash(){
  var color = PROFILE.color || '#7c6fff';

  var av = document.getElementById('hdr-avatar');
  av.textContent = (PROFILE.display_name || PROFILE.username)[0].toUpperCase();
  av.style.background = 'linear-gradient(135deg,'+color+',#00e5b0)';
  av.style.boxShadow = '0 0 20px '+color+'66';

  document.getElementById('hdr-name').textContent = PROFILE.display_name || PROFILE.username;
  document.getElementById('hdr-domain').textContent = 'maxaas.u/' + PROFILE.username;
  document.getElementById('share-link-text').textContent = 'maxaas.u/' + PROFILE.username;

  document.getElementById('prof-name').value = PROFILE.display_name || PROFILE.username;
  document.getElementById('prof-bio').value = PROFILE.bio || '';
  document.getElementById('prof-color').value = color;
  document.getElementById('color-preview').style.background = 'linear-gradient(135deg,'+color+',#00e5b0)';
  document.getElementById('color-hex').textContent = color;

  loadLinks();
}

async function saveProfile(){
  var btn = document.getElementById('save-profile-btn');
  btn.disabled = true; btn.textContent = '...';

  var display_name = document.getElementById('prof-name').value.trim() || PROFILE.username;
  var bio = document.getElementById('prof-bio').value.trim();
  var color = document.getElementById('prof-color').value;

  var { error } = await sb.from('profiles').update({ display_name, bio, color }).eq('id', ME.id);
  if(error){ toast('Khalad: ' + error.message, true); }
  else {
    PROFILE.display_name = display_name;
    PROFILE.bio = bio;
    PROFILE.color = color;
    refreshDash();
    toast('✓ Profile la keydiiyay!');
  }

  btn.disabled = false; btn.textContent = '✓ Keydi Profile';
}

function updateColorPreview(){
  var c = document.getElementById('prof-color').value;
  document.getElementById('color-preview').style.background='linear-gradient(135deg,'+c+',#00e5b0)';
  document.getElementById('color-hex').textContent = c;
}

// ── LINKS ────────────────────────────────────────────────────
async function loadLinks(){
  var { data, error } = await sb.from('links')
    .select('*')
    .eq('user_id', ME.id)
    .order('position', { ascending: true });

  if(error){ toast('Links loading khalad', true); return; }
  renderLinks(data || []);
}

function renderLinks(links){
  var list = document.getElementById('link-list');
  if(!links.length){
    list.innerHTML = '<div class="empty-state">🔗<br/>Links ma jiraan weli.<br/>Mid ku dar!</div>';
    return;
  }
  list.innerHTML = links.map(function(l){
    return '<div class="link-item" id="li-'+l.id+'">'
      +'<div class="link-info">'
      +'<div class="link-title">'+esc(l.title)+'</div>'
      +'<div class="link-url">'+esc(l.url)+'</div>'
      +'</div>'
      +'<div class="link-actions">'
      +'<button class="icon-btn btn-edit" onclick="startEdit(\''+l.id+'\',\''+esc(l.title)+'\',\''+esc(l.url)+'\')">✏️</button>'
      +'<button class="icon-btn btn-del" onclick="delLink(\''+l.id+'\')">🗑</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

async function addLink(){
  var t  = document.getElementById('new-title').value.trim();
  var u2 = document.getElementById('new-url').value.trim();
  var err = document.getElementById('link-err');
  var btn = document.getElementById('add-btn');
  if(!t || !u2){ err.textContent = 'Cinwaanka iyo URL-ka buuxi'; return; }
  if(!u2.startsWith('http')) u2 = 'https://' + u2;
  err.textContent = '';
  btn.disabled = true;

  // Get current max position
  var { data: existing } = await sb.from('links').select('position').eq('user_id', ME.id).order('position', {ascending:false}).limit(1);
  var pos = existing && existing.length ? (existing[0].position + 1) : 0;

  var { error } = await sb.from('links').insert({ user_id: ME.id, title: t, url: u2, position: pos });
  if(error){ err.textContent = error.message; btn.disabled=false; return; }

  document.getElementById('new-title').value = '';
  document.getElementById('new-url').value = '';
  btn.disabled = false;
  toast('✓ Link la daray!');
  loadLinks();
}

async function delLink(id){
  var { error } = await sb.from('links').delete().eq('id', id).eq('user_id', ME.id);
  if(error){ toast('Khalad: ' + error.message, true); return; }
  toast('🗑 La tirtiraye');
  loadLinks();
}

function startEdit(id, title, url){
  var el = document.getElementById('li-'+id);
  el.innerHTML = '<div style="width:100%">'
    +'<input id="et-'+id+'" value="'+title+'" style="margin-bottom:8px"/>'
    +'<input id="eu-'+id+'" value="'+url+'"/>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<button onclick="saveEdit(\''+id+'\')" style="padding:9px 18px;border-radius:8px;background:linear-gradient(135deg,#7c6fff,#00e5b0);color:#fff;font-weight:700">Keydi</button>'
    +'<button onclick="loadLinks()" style="padding:9px 18px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#aaa">Jooji</button>'
    +'</div></div>';
}

async function saveEdit(id){
  var t  = document.getElementById('et-'+id).value.trim();
  var u2 = document.getElementById('eu-'+id).value.trim();
  if(!t || !u2) return;
  if(!u2.startsWith('http')) u2 = 'https://' + u2;
  var { error } = await sb.from('links').update({ title: t, url: u2 }).eq('id', id).eq('user_id', ME.id);
  if(error){ toast('Khalad: ' + error.message, true); return; }
  toast('✓ Link la cusbooneysiiyay!');
  loadLinks();
}

// ── TABS ─────────────────────────────────────────────────────
function switchTab(name, btn){
  document.getElementById('tab-links').classList.toggle('hidden', name!=='links');
  document.getElementById('tab-profile').classList.toggle('hidden', name!=='profile');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

// ── COPY LINK ────────────────────────────────────────────────
function copyLink(){
  var txt = 'maxaas.u/' + PROFILE.username;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  var btn = document.getElementById('copy-btn');
  btn.textContent = '✓ La koobiyeeyay!';
  btn.classList.add('copied');
  toast('✓ La koobiyeeyay!');
  setTimeout(()=>{ btn.textContent='📋 Koobiyee'; btn.classList.remove('copied'); }, 2000);
}

// ── BIO PREVIEW ──────────────────────────────────────────────
async function openPreview(){
  var { data: links } = await sb.from('links').select('*').eq('user_id', ME.id).order('position',{ascending:true});
  renderBio(PROFILE, links || []);
  show('bio');
}

function closeBio(){
  show('dash');
}

function renderBio(profile, links){
  var color = profile.color || '#7c6fff';
  var av = document.getElementById('bio-avatar');
  av.textContent = (profile.display_name || profile.username)[0].toUpperCase();
  av.style.background = 'linear-gradient(135deg,'+color+',#00e5b0)';
  av.style.boxShadow  = '0 0 50px '+color+'60';

  document.getElementById('bio-name').textContent = profile.display_name || profile.username;
  document.getElementById('bio-bio').textContent  = profile.bio || '';
  document.getElementById('bio-bio').classList.toggle('hidden', !profile.bio);
  document.getElementById('bio-domain-txt').textContent = 'maxaas.u/' + profile.username;

  var el = document.getElementById('bio-links');
  if(!links.length){
    el.innerHTML = '<p style="color:#444;text-align:center">Links ma jiraan weli.</p>';
    return;
  }
  el.innerHTML = links.map((l,i)=>
    '<a class="bio-link" href="'+l.url+'" target="_blank" rel="noreferrer" style="animation-delay:'+(i*0.08)+'s">'
    +'<span class="bio-link-title">'+esc(l.title)+'</span>'
    +'<span style="font-size:20px;opacity:.5">→</span>'
    +'</a>'
  ).join('');
}

// ── TOAST ────────────────────────────────────────────────────
function toast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isErr);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── HELPERS ──────────────────────────────────────────────────
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── BG BLOBS ─────────────────────────────────────────────────
document.body.insertAdjacentHTML('beforeend',
  '<div style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden">'
  +'<div style="position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,111,255,0.08) 0%,transparent 70%);top:-200px;right:-200px"></div>'
  +'<div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,176,0.06) 0%,transparent 70%);bottom:-100px;left:-100px"></div>'
  +'</div>'
);
</script>
</body>
</html>
